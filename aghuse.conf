###############################################################################
#  AGHUse 13.250-STABLE - Parametros de instalacao
#
#  Edite este arquivo antes de executar:  sudo ./instalar.sh
#  Senhas deixadas em branco ("") sao geradas automaticamente (32 caracteres
#  aleatorios) e gravadas em /root/aghuse-credenciais-<SERVICO>.txt
#  Senhas informadas manualmente devem ter no minimo 16 caracteres
#  (20 em producao) e conter apenas letras e numeros.
###############################################################################

#------------------------------------------------------------------------------
# 1. TIPO DE AMBIENTE
#------------------------------------------------------------------------------
# teste    -> instalacao para avaliacao e estudo do sistema (padrao)
# producao -> aplica verificacoes adicionais e exige a confirmacao abaixo
AMBIENTE="teste"

# Em producao (exige MODO_LOGIN="ldap-externo"), informe "sim" para confirmar que leu a secao
# "Uso em producao" do README.md e assume integralmente a responsabilidade
# pela validacao, seguranca, backup e suporte do ambiente.
CONFIRMO_PRODUCAO="nao"

# Nome exibido para o ambiente
NOME_AMBIENTE="AGHUSE-TESTE"

#------------------------------------------------------------------------------
# 2. AUTENTICACAO (LOGIN)
#------------------------------------------------------------------------------
# O AGHUse nao armazena senhas: o login e validado em um diretorio LDAP/AD e o
# cadastro do usuario, da pessoa, do vinculo e dos perfis e feito na aplicacao.
#
# ldap-local   -> instala um OpenLDAP nesta maquina para o teste (padrao).
#                 Contas de acesso: sudo ./usuario.sh criar LOGIN
# ldap-externo -> usa o LDAP / Active Directory da instituicao (obrigatorio
#                 em producao). As contas sao administradas no proprio AD.
# banco        -> avaliacao rapida sem diretorio: a senha e conferida pelo
#                 PostgreSQL. Indicado apenas para testar com o administrador.
MODO_LOGIN="ldap-local"

# Usuario administrador que ja vem cadastrado na base inicial do AGHUse
ADMIN_LOGIN="AGHU"
ADMIN_SENHA=""

#--- Somente para MODO_LOGIN="ldap-local" -------------------------------------
LDAP_LOCAL_DOMINIO="aghuse.local"      # gera a base dc=aghuse,dc=local
LDAP_LOCAL_ADMIN_SENHA=""              # em branco: gerada e guardada em /etc/aghuse/ldap-local.senha

#--- Somente para MODO_LOGIN="ldap-externo" -----------------------------------
# Exemplo para Active Directory:
#   LDAP_HOST="ad.instituicao.local"          (varios servidores: separe por virgula)
#   LDAP_USER_DN="%s@instituicao.local"       (%s = login digitado)
#   LDAP_BASE_USUARIOS="DC=instituicao,DC=local"
#   LDAP_ATRIBUTO_LOGIN="sAMAccountName"
#   LDAP_FILTRO="(&(objectClass=user)(sAMAccountName=%s))"
# Exemplo para OpenLDAP:
#   LDAP_USER_DN="uid=%s,ou=people,dc=instituicao,dc=local"
#   LDAP_ATRIBUTO_LOGIN="uid"
#   LDAP_FILTRO="(&(objectClass=inetOrgPerson)(uid=%s))"
LDAP_HOST=""
LDAP_PORTA="389"
LDAP_USER_DN=""
LDAP_BASE_USUARIOS=""
LDAP_ATRIBUTO_LOGIN=""
LDAP_FILTRO=""
LDAP_BIND_DN=""          # conta de servico (opcional, usada na importacao de usuarios)
LDAP_BIND_SENHA=""

#------------------------------------------------------------------------------
# 3. BANCO DE DADOS (PostgreSQL)
#------------------------------------------------------------------------------
# Versao do PostgreSQL. A base inicial foi gerada em PostgreSQL 15.
PG_VERSAO="15"
# Porta do cluster. Em branco: usa o cluster ja existente dessa versao ou
# cria um novo na primeira porta livre a partir de 5432.
PG_PORTA=""
DB_NOME="dbaghu"
DB_USUARIO="ugen_aghu"
DB_SENHA=""
DB_USUARIO_FIT="ugen_aghu_fit"
DB_SENHA_FIT=""
# "sim" apaga e recria o banco DB_NOME a partir da base inicial.
# "nao" mantem o banco se ele ja existir (reinstalacao preserva os dados).
RECRIAR_BANCO="nao"

#------------------------------------------------------------------------------
# 4. SERVIDOR DE APLICACAO (WildFly)
#------------------------------------------------------------------------------
PREFIXO="/opt/aghuse"            # diretorio de instalacao (Java + WildFly)
SERVICO="aghuse"                 # nome do servico systemd
USUARIO_SO="aghuse"              # usuario do sistema que executa o WildFly
HTTP_BIND="0.0.0.0"              # 0.0.0.0 = todas as interfaces; 127.0.0.1 = so local (use com proxy reverso)
# "sim" quando o sistema for acessado por um proxy reverso com HTTPS (nginx, Apache,
# balanceador). Ativa proxy-address-forwarding no WildFly; sem isso o login por HTTPS
# falha, porque o WildFly redireciona o navegador para http://. Obrigatorio em producao.
PROXY_REVERSO="nao"
PORT_OFFSET="0"                  # 0 = porta 8080; 100 = porta 8180 ...
MEMORIA_JVM=""                   # ex.: "5G". Em branco: 5G (recomendado) ou ajuste automatico pela RAM
FUSO_HORARIO="America/Sao_Paulo"
SMTP_HOST="127.0.0.1"            # servidor de e-mail (porta 25)

#------------------------------------------------------------------------------
# 5. AVANCADO - origem dos componentes (normalmente nao alterar)
#------------------------------------------------------------------------------
# Se os arquivos existirem em ./pacote/downloads/ eles sao usados sem download.
JDK_URL="https://download.java.net/java/GA/jdk17.0.2/dfd4a8d0985749f896bed50d7138ee7f/8/GPL/openjdk-17.0.2_linux-x64_bin.tar.gz"
JDK_SHA256="0022753d0cceecacdd3a795dd4cea2bd7ffdf9dc06e22ffd1be98411742fbb44"
WILDFLY_URL="https://github.com/wildfly/wildfly/releases/download/26.1.3.Final/wildfly-26.1.3.Final.zip"
WILDFLY_SHA256="dd615f2d0d9864683fd45827dd78a3e7fed2b0ee84e1a758ad571fc6edb37ebc"
