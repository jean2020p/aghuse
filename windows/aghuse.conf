###############################################################################
#  AGHUse 13.250-STABLE - Parametros de instalacao (WINDOWS)
#
#  Os valores abaixo ja formam um AMBIENTE DE TESTE PRONTO (LDAP local, administrador
#  AGHU, porta 8080): o instalador grafico (aghuse_setup.exe) usa estes valores sem
#  pedir nada. Para PRODUCAO ou outra configuracao, ajuste este arquivo (recomendado)
#  e execute instalar.bat como Administrador. Mesmo formato do aghuse.conf do Linux.
#
#  Senhas deixadas em branco ("") sao geradas automaticamente e gravadas em
#  C:\ProgramData\AGHUse\aghuse-credenciais-<SERVICO>.txt (somente Administradores):
#  administrador com 12 caracteres, contas internas com 32. Senhas informadas: somente
#  letras e numeros; ADMIN_SENHA com no minimo 8 caracteres, as demais com 16 (20 em producao).
###############################################################################

#------------------------------------------------------------------------------
# 1. TIPO DE AMBIENTE
#------------------------------------------------------------------------------
AMBIENTE="teste"                 # teste | producao
CONFIRMO_PRODUCAO="nao"          # "sim" em producao (ver "Uso em producao" no README.md)
NOME_AMBIENTE="AGHUSE-TESTE"

#------------------------------------------------------------------------------
# 2. AUTENTICACAO (LOGIN)
#------------------------------------------------------------------------------
# ldap-local   -> diretorio LDAP neste computador (padrao, recomendado para teste): AD LDS,
#                 componente gratuito do proprio Windows (servico ADAM_<SERVICO>ldap), base
#                 DC=aghuse,DC=local, so acessivel por este computador.
#                 Contas de acesso: usuario.bat criar LOGIN
# ldap-externo -> usa o LDAP / Active Directory da instituicao (obrigatorio em producao)
# banco        -> avaliacao sem diretorio: a senha e conferida pelo PostgreSQL
MODO_LOGIN="ldap-local"

ADMIN_LOGIN="AGHU"
ADMIN_SENHA=""                   # em branco: gerada (12 caracteres); informada: minimo 8

#--- Somente para MODO_LOGIN="ldap-local" -------------------------------------
LDAP_LOCAL_PORTA="50389"         # porta do AD LDS (SSL: esta + 247)

#--- Somente para MODO_LOGIN="ldap-externo" -----------------------------------
# Exemplo para Active Directory:
#   LDAP_HOST="ad.instituicao.local"
#   LDAP_USER_DN="%s@instituicao.local"       (%s = login digitado)
#   LDAP_BASE_USUARIOS="DC=instituicao,DC=local"
#   LDAP_ATRIBUTO_LOGIN="sAMAccountName"
#   LDAP_FILTRO="(&(objectClass=user)(sAMAccountName=%s))"
LDAP_HOST=""
LDAP_PORTA="389"
LDAP_USER_DN=""
LDAP_BASE_USUARIOS=""
LDAP_ATRIBUTO_LOGIN=""
LDAP_FILTRO=""
LDAP_BIND_DN=""
LDAP_BIND_SENHA=""

#------------------------------------------------------------------------------
# 3. BANCO DE DADOS (PostgreSQL 15, instalado em <PREFIXO>\pgsql e <PREFIXO>\pgdata)
#------------------------------------------------------------------------------
PG_PORTA=""                      # em branco: primeira porta livre a partir de 5432
PG_SENHA_POSTGRES=""             # superusuario postgres (em branco: gerada)
DB_NOME="dbaghu"
DB_USUARIO="ugen_aghu"
DB_SENHA=""
DB_USUARIO_FIT="ugen_aghu_fit"
DB_SENHA_FIT=""
RECRIAR_BANCO="nao"              # "sim" apaga e recria o banco a partir da base inicial

#------------------------------------------------------------------------------
# 4. SERVIDOR DE APLICACAO (WildFly)
#------------------------------------------------------------------------------
PREFIXO="C:\AGHUse"              # pasta de instalacao (sem espacos)
SERVICO="aghuse"                 # nome do servico do Windows (PostgreSQL: <SERVICO>-postgresql)
CONTA_SERVICO="LocalService"     # LocalService | NetworkService | LocalSystem
HTTP_BIND="0.0.0.0"              # 127.0.0.1 = so local (use com proxy reverso)
PROXY_REVERSO="nao"              # "sim" atras de proxy reverso com HTTPS (obrigatorio em producao)
PORT_OFFSET="0"                  # 0 = porta 8080; 100 = porta 8180 ...
MEMORIA_JVM=""                   # ex.: "6G". Em branco: 5G (minimo 5G; com 4G o AGHUse nao inicializa). A maquina precisa de 12 GB de RAM ou mais
FUSO_HORARIO="America/Sao_Paulo"
SMTP_HOST="127.0.0.1"
LIBERAR_FIREWALL="sim"           # libera a porta HTTP no Firewall do Windows (redes privadas/dominio)
